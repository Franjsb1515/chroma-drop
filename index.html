function parseLevel(L) {
  const S = { grid: [], curse: [], paint: [], turn: [], goo: [], tele: [], pads: [], portals: L.portals || [], pot: {}, potIds: {}, moves: L.moves, mana: 0,
    mpc: L.manaPerCell || 6, cap: L.cap || 6, over: false, total: 0, left: 0, combo: 0, heat: 0, pending: [] };
  for (const k of COLOR_KEYS) { S.pot[k] = 0; S.potIds[k] = []; }
  S.pot.W = 0; S.potIds.W = [];             // W = Fluffy Arcoíris (comodín)
  let id = 1;
  for (let r = 0; r < ROWS; r++) {
    S.grid.push([]); S.curse.push([]); S.turn.push([]); S.goo.push([]); S.tele.push([]); S.paint.push(new Array(COLS).fill(0));
    const toks = (L.grid[r] || '').trim().split(/\s+/);
    for (let c = 0; c < COLS; c++) {
      const t = toks[c] || '..'; let e = null; S.curse[r][c] = t === 'xx';
      const isTurn = t === '>>' || t === '<<' || t === '^^' || t === 'vv'; S.turn[r][c] = isTurn ? t[0] : null;
      S.goo[r][c] = t === '~~'; S.tele[r][c] = -1;                  // ~~ lodo · oo portal gemelo
      if (t === 'oo') { S.tele[r][c] = S.pads.length; S.pads.push([c, r]); }
      if (t === '##') e = { k: 'frost', hp: 2 };
      else if (t === '%%') e = { k: 'stone', hp: 2 };
      else if (t === 'TT') e = { k: 'tnt' };
      else if (t !== '..' && t !== 'xx' && t !== '~~' && t !== 'oo' && !isTurn) {
        const col = t[0].toUpperCase(), s = t[1], ch = t[0] !== col;
        if (s === '@' || s === '(') { e = { k: 'fluffy', col, bub: s === '(' }; S.total++; S.left++; }   // R( = Fluffy en burbuja
        else if (s === 'o') e = { k: 'free', col, ch };
        else if (s === '=') e = { k: 'seal', col };
        else e = { k: 'arrow', col, dir: s, ch };
      }
      if (e) e.id = id++;
      S.grid[r].push(e);
    }
  }
  return S;
}
const spellable = e => !!e && e.k !== 'fluffy' && e.k !== 'seal';
const hittable = e => spellable(e) || (!!e && e.k === 'fluffy' && !!e.bub);   // también revienta burbujas

function slideInfo(S, c, r, d) {
  const e = S.grid[r][c];
  if (!e || (e.k !== 'arrow' && e.k !== 'free') || e.ch) return null;
  if (e.k === 'arrow' && d !== e.dir) return null;
  let [dx, dy] = DIRS[d], x = c, y = r, exit = false, b = null, bc = -1, br = -1, turned = false, tele = false, stuck = false; const steps = [];
  for (;;) {
    const nx = x + dx, ny = y + dy;
    if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) { exit = true; break; }
    const o = S.grid[ny][nx];
    if (o && o !== e) { b = o; bc = nx; br = ny; break; }
    x = nx; y = ny; steps.push([x, y]);
    if (S.goo[y][x]) { stuck = true; break; }     // lodo: el bloque se queda pegado
    const t = S.turn[y][x];                       // runa de giro: desvía el bloque
    if (t) { const [tx, ty] = DIRS[t]; if (tx !== dx || ty !== dy) turned = true; dx = tx; dy = ty; }
    const tp = S.tele[y][x];                      // portal gemelo: sale por el otro y sigue
    if (tp >= 0 && S.pads.length === 2) { const [ox, oy] = S.pads[1 - tp], occ = S.grid[oy][ox]; if (!occ || occ === e) { x = ox; y = oy; steps.push([x, y, 1]); tele = true; } }
    if (steps.length > 50) break;                 // bucle de runas: el bloque se detiene
  }
  let leave = false, portal = null;
  if (exit) {
    if (e.k === 'arrow') leave = true;
    else {
      const side = dx < 0 ? 'L' : dx > 0 ? 'R' : dy < 0 ? 'T' : 'B', i = dx ? y : x;
      portal = S.portals.find(p => p.side === side && p.i === i && p.color === e.col) || null; leave = !!portal;

  }
  const impact = !!b && (b.k === 'frost' || b.k === 'tnt' || !!b.ch || (b.k === 'stone' && e.col === 'G') || (b.k === 'fluffy' && !!b.bub));   // Naturaleza agrieta la piedra

  return { e, steps, leave, portal, impact, b, bc, br, x, y, dx, dy, turned, tele, stuck };
}

/* destruye lo destruible de unas celdas; los barriles alcanzados quedan pendientes de explotar */
function blast(S, cells) {
  const ids = [], tnts = [], pops = [];
  for (const [x, y] of cells) {
    const e = S.grid[y][x];
    if (e && e.k === 'fluffy' && e.bub) { e.bub = false; pops.push(e.id); continue; }
    if (!spellable(e)) continue;
    S.grid[y][x] = null; if (e.k === 'tnt') tnts.push([x, y, e.id]); else ids.push(e.id);
  }
  return { ids, tnts, pops };
}
/* barriles de pólvora: explosión 3x3 que detona otros barriles (reacción en cadena) */
function detonate(S, list, ev) {
  let n = 0;
  while (list.length) {
    const [c, r, id] = list.shift(), cells = []; n++;
    for (let y = r - 1; y <= r + 1; y++) for (let x = c - 1; x <= c + 1; x++) if (x >= 0 && x < COLS && y >= 0 && y < ROWS) cells.push([x, y]);
    const b = blast(S, cells); ev.push({ t: 'boom', id, c, r, cells, ids: b.ids, pops: b.pops, n }); list.push(...b.tnts);
  }
}

function aimCells(p, c, r) {
  const out = [];
  if (p.kind === 'col') { const w = p.amp ? 1 : 0; for (let x = c - w; x <= c + w; x++) if (x >= 0 && x < COLS) for (let y = 0; y < ROWS; y++) out.push([x, y]); }
  else { const w = p.amp ? 2 : 1; for (let y = r - w; y <= r + w; y++) for (let x = c - w; x <= c + w; x++) if (x >= 0 && x < COLS && y >= 0 && y < ROWS) out.push([x, y]); }
  return out;
}
function anySpellable(S) { for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (hittable(S.grid[r][c])) return true; return false; }

/* Los Fluffies caen por su columna; si no hay nada debajo salen al caldero. */
function settle(S, ev) {
  const drops = [];
  for (let r = ROWS - 1; r >= 0; r--) for (let c = 0; c < COLS; c++) {
    const e = S.grid[r][c]; if (!e || e.k !== 'fluffy' || e.bub) continue;     // en burbuja: flota
    let nr = r; while (nr + 1 < ROWS && !S.grid[nr + 1][c]) nr++;
    if (nr === ROWS - 1) { S.grid[r][c] = null; S.left--; drops.push({ id: e.id, col: e.col, c }); ev.push({ t: 'drop', id: e.id, c }); }
    else if (nr !== r) { S.grid[r][c] = null; S.grid[nr][c] = e; ev.push({ t: 'fall', id: e.id, r: nr }); }
  }
  return drops;
}

/* Reacción en cadena: caídas -> fusiones -> hechizos -> más caídas... */
function resolve(S, ev) {
  for (let guard = 0; guard < 80; guard++) {
    if (S.left === 0) { S.pending = []; return; }
    while (S.pending.length && !anySpellable(S)) { ev.push({ t: 'fizzle', color: S.pending[0].color }); S.pending.shift(); }
    if (S.pending.length) return;                 // espera a que el jugador apunte
    const drops = settle(S, ev); if (!drops.length) return;
    for (const d of drops) {
      S.pot[d.col]++; S.potIds[d.col].push(d.id);
      let k = null;                    // color que se fusiona (el Arcoíris completa al color más avanzado)
      if (d.col === 'W') { let bestN = 0; for (const q of COLOR_KEYS) if (S.pot[q] > bestN && S.pot[q] + S.pot.W >= 3) { bestN = S.pot[q]; k = q; } }
      else if (S.pot[d.col] + S.pot.W >= 3) k = d.col;
      if (!k) {                        // el caldero se desborda si acumula demasiados Fluffies sin fusionar
        let tot = S.pot.W; for (const q of COLOR_KEYS) tot += S.pot[q];
        if (tot > S.cap) { S.over = true; S.pending = []; ev.push({ t: 'overflow' }); return; }
        continue;
      }
      const need = Math.max(0, 3 - S.pot[k]), ids = S.potIds[k].concat(S.potIds.W.splice(0, need));
      S.pot.W -= need; S.pot[k] = 0; S.potIds[k] = []; S.combo++; S.heat++;
      // Sobrecarga: por combo en la misma jugada, o porque el caldero hierve (cada 3ª fusión del nivel)
      const amp = S.combo >= 2 || S.heat % 3 === 0, sp = SPELLS[k];
      ev.push({ t: 'fuse', color: k, ids, combo: S.combo, amp, wild: need > 0, heat: S.heat, boil: S.heat % 3 === 0 });
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
        const e = S.grid[r][c]; if (e && e.k === 'seal' && e.col === k) { S.grid[r][c] = null; ev.push({ t: 'seal', id: e.id }); }
      }
      if (sp.kind === 'thaw') {
        const ids2 = [], un = [];
        for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
          const e = S.grid[r][c]; if (!e) continue;
          if (e.k === 'frost' || (amp && e.k === 'stone')) { S.grid[r][c] = null; ids2.push(e.id); }
          else if (e.ch) { e.ch = false; un.push(e.id); }
        }
        ev.push({ t: 'spell', kind: 'thaw', color: k, amp, ids: ids2, un });
      } else if (sp.kind === 'time') {
        S.moves += amp ? RULES.timeMovesAmp : RULES.timeMoves;
        ev.push({ t: 'spell', kind: 'time', color: k, amp, moves: S.moves, add: amp ? RULES.timeMovesAmp : RULES.timeMoves });
      } else if (sp.kind === 'mana') {
        S.mana = 100; if (amp) S.moves++;
        ev.push({ t: 'spell', kind: 'mana', color: k, amp, moves: S.moves, mana: 100 });
      } else S.pending.push({ color: k, kind: sp.kind, amp });
    }
  }
}

/* RESONANCIA (combinación en el tablero): si el bloque movido queda en línea con 2+ bloques rúnicos
   de su color, todos se desvanecen y liberan el efecto de su elemento sobre las casillas vecinas. */
const ELEMENTS = {
  R: { name: 'Fuego',      fx: 'derrite el hielo vecino' },
  G: { name: 'Naturaleza', fx: 'rompe la piedra vecina' },
  B: { name: 'Agua',       fx: 'rompe las cadenas vecinas' },
  Y: { name: 'Rayo',       fx: '+1 movimiento' },
  P: { name: 'Arcano',     fx: '+30 de maná' },

function resonance(S, x, y, ev) {
  const e = S.grid[y][x]; if (!e || (e.k !== 'arrow' && e.k !== 'free')) return;
  const same = (cx, cy) => { const o = S.grid[cy][cx]; return !!o && (o.k === 'arrow' || o.k === 'free') && o.col === e.col; };
  const line = (dx, dy) => {
    const cells = [[x, y]];
    for (const s of [1, -1]) { let cx = x + dx * s, cy = y + dy * s; while (cx >= 0 && cx < COLS && cy >= 0 && cy < ROWS && same(cx, cy)) { cells.push([cx, cy]); cx += dx * s; cy += dy * s; } }
    return cells;
  };
  const h = line(1, 0), v = line(0, 1); let cells = [];
  if (h.length >= 3) cells = h; if (v.length >= 3) cells = cells.concat(v.filter(([a, b]) => !cells.some(q => q[0] === a && q[1] === b)));
  if (!cells.length) return;
  const ids = [], extra = [], un = [], col = e.col;
  for (const [cx, cy] of cells) { ids.push(S.grid[cy][cx].id); S.grid[cy][cx] = null; }
  for (const [cx, cy] of cells) for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
    const nx = cx + dx, ny = cy + dy; if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
    const o = S.grid[ny][nx]; if (!o) continue;
    if ((col === 'R' && o.k === 'frost') || (col === 'G' && o.k === 'stone')) { S.grid[ny][nx] = null; extra.push(o.id); }
    else if (col === 'B' && o.ch) { o.ch = false; un.push(o.id); }
  }
  if (col === 'Y') S.moves += 1;
  if (col === 'P') S.mana = Math.min(100, S.mana + 30);
  ev.push({ t: 'match', color: col, cells, ids, extra, un, moves: S.moves, mana: S.mana });
}

/* Movimientos: {t:'slide',c,r,d} · {t:'portal',r} · {t:'aim',c,r} (cuando hay hechizo pendiente) */
function applyMove(S, m, ev) {
  ev = ev || []; if (S.over) return false;
  if (S.pending.length) {
    if (m.t !== 'aim' || m.c < 0 || m.c >= COLS || m.r < 0 || m.r >= ROWS) return false;
    const p = S.pending[0], cells = aimCells(p, m.c, m.r);
    if (!cells.some(([x, y]) => hittable(S.grid[y][x]))) return false;
    const bl = blast(S, cells); S.pending.shift();
    ev.push({ t: 'spell', kind: p.kind, color: p.color, amp: p.amp, c: m.c, r: m.r, cells, ids: bl.ids, pops: bl.pops });
    detonate(S, bl.tnts, ev);
  } else if (m.t === 'portal') {
    if (S.mana < 100 || !S.grid[m.r].some(hittable)) return false;
    const cells = []; for (let c = 0; c < COLS; c++) cells.push([c, m.r]);
    const bl = blast(S, cells); S.mana = 0; S.combo = 0; ev.push({ t: 'portal', r: m.r, ids: bl.ids, pops: bl.pops, mana: 0 });
    detonate(S, bl.tnts, ev);
  } else if (m.t === 'slide') {
    if (S.moves <= 0) return false;
    const inf = slideInfo(S, m.c, m.r, m.d); if (!inf) return false;
    S.combo = 0; S.moves--;
    let cursed = false, fresh = 0;       // el maná solo sube al pintar casillas NUEVAS
    for (const [x, y] of inf.steps) { if (S.curse[y][x]) cursed = true; if (!S.paint[y][x]) { S.paint[y][x] = 1; fresh++; } }
    S.mana = Math.min(100, S.mana + S.mpc * fresh);
    if (cursed) { S.moves = Math.max(0, S.moves - 1); S.mana = Math.max(0, S.mana - RULES.curseMana); }
    S.grid[m.r][m.c] = null; if (!inf.leave) S.grid[inf.y][inf.x] = inf.e;
    ev.push({ t: 'slide', id: inf.e.id, from: [m.c, m.r], steps: inf.steps, to: [inf.x, inf.y], dx: inf.dx, dy: inf.dy,
      leave: inf.leave, portal: inf.portal, cursed, turned: inf.turned, tele: inf.tele, stuck: inf.stuck, moves: S.moves, mana: S.mana, bid: inf.b ? inf.b.id : 0 });
    if (inf.impact) {
      const b = inf.b;
      if (b.k === 'tnt') { S.grid[inf.br][inf.bc] = null; detonate(S, [[inf.bc, inf.br, b.id]], ev); }
      else if (b.k === 'fluffy') { b.bub = false; ev.push({ t: 'pop', id: b.id }); }
      else if (b.ch) { b.ch = false; ev.push({ t: 'unchain', id: b.id }); }
      else if ((b.hp -= (b.k === 'frost' && inf.e.col === 'R') ? 2 : 1) <= 0) {     // Fuego derrite el hielo de un golpe
        S.grid[inf.br][inf.bc] = null; ev.push({ t: 'break', id: b.id, by: b.k === 'stone' ? 'root' : inf.e.col === 'R' ? 'fire' : '' });
      } else ev.push({ t: 'crack', id: b.id });
    }
    if (!inf.leave && inf.steps.length) resonance(S, inf.x, inf.y, ev);
  } else return false;
  resolve(S, ev); return true;
}

function legalMoves(S) {
  const out = []; if (S.over) return out;
  if (S.pending.length) {
    const p = S.pending[0], seen = new Set();
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (p.kind === 'col' && r > 0) continue;
      const ids = []; for (const [x, y] of aimCells(p, c, r)) if (hittable(S.grid[y][x])) ids.push(S.grid[y][x].id);
      const key = ids.join(','); if (!ids.length || seen.has(key)) continue; seen.add(key); out.push({ t: 'aim', c, r });
    }
    return out;
  }
  if (S.moves > 0) for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const e = S.grid[r][c]; if (!e) continue;
    if (e.k === 'arrow') { if (slideInfo(S, c, r, e.dir)) out.push({ t: 'slide', c, r, d: e.dir }); }
    else if (e.k === 'free') for (const d in DIRS) if (slideInfo(S, c, r, d)) out.push({ t: 'slide', c, r, d });

  if (S.mana >= 100) for (let r = 0; r < ROWS; r++) if (S.grid[r].some(hittable)) out.push({ t: 'portal', r });
  return out;
}

function fireCol(q) {        // color de una bocanada según su edad: blanco → amarillo → naranja → rojo → humo

    const same = V.sel && V.sel.c === c && (V.aim.kind === 'col' || V.sel.r === r);

    else { V.sel = { c, r }; Snd.aim(); }

  }

  if (!drag || drag.done || drag.e.k !== 'free' || busy()) return;
  const dx = x - drag.x, dy = y - drag.y;
  if (Math.hypot(dx, dy) > 20) { drag.done = true; tryMove(drag.c, drag.r, Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? '>' : '<') : (dy > 0 ? 'v' : '^')); }
}
function onUp() {
  if (!drag) return; const { e, c, r } = drag, s = V.sp.get(e.id);
  if (!drag.done && s) {
    if (e.k === 'arrow') { if (busy()) V.buf = { id: e.id, d: e.dir }; else tryMove(c, r, e.dir); }
    else if (e.k === 'free') { s.shake = 1; floater(s.x, s.y - 40, e.ch ? '¡Encadenado!' : 'Arrástrame', '#ffd9d9', 16, 0.9); Snd.bump(); }
    else if (e.k === 'fluffy') { s.sq = 0.25; Snd.boing(0.6); if (e.bub) floater(s.x, s.y - 44, 'Burbuja: golpéala con un bloque', '#dff6ff', 15, 1.2); }
    else { s.shake = 1; Snd.bump(); floater(s.x, s.y - 40, e.k === 'frost' ? 'Hielo: 2 impactos o hechizo' : e.k === 'stone' ? 'Piedra: solo hechizos' : e.k === 'tnt' ? 'Barril: golpéalo con un bloque' : 'Sello: fusiona su color', '#ffd9d9', 15, 1.2); }
  }
  drag = null;
}
function bindInput() {
  const t = f => ev => { ev.preventDefault(); const p = ev.changedTouches[0]; f(...toLocal(p.clientX, p.clientY)); };
  cv.addEventListener('touchstart', t(onDown), { passive: false });
  cv.addEventListener('touchmove', t(onMove), { passive: false });
  cv.addEventListener('touchend', ev => { ev.preventDefault(); onUp(); }, { passive: false });
  cv.addEventListener('touchcancel', () => { drag = null; });
  cv.addEventListener('mousedown', ev => onDown(...toLocal(ev.clientX, ev.clientY)));
  window.addEventListener('mousemove', ev => onMove(...toLocal(ev.clientX, ev.clientY)));
  window.addEventListener('mouseup', onUp);
  window.addEventListener('contextmenu', ev => ev.preventDefault());
}

/* ---------- BUCLE PRINCIPAL ---------- */
function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H), dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.style.width = Math.floor(W * s) + 'px'; cv.style.height = Math.floor(H * s) + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr); scale = cv.width / W;
}
let lastT = 0;
function frame(t) {
  const dt = Math.min(0.033, (t - lastT) / 1000 || 0.016); lastT = t;
  if (!(window.CHROMA && window.CHROMA.paused)) update(dt);   // paused: solo para depurar
  draw(); requestAnimationFrame(frame);
}
window.addEventListener('load', () => {
  cv = document.getElementById('game'); ctx = cv.getContext('2d');
  load(); resize(); bindInput(); window.addEventListener('resize', resize);
  window.CHROMA = { G, V, LEVELS, loadLevel, doMove, busy, get S() { return S; }, step(n) { for (let i = 0; i < n; i++) update(1 / 60); } };   // depuración
  requestAnimationFrame(frame);
});
</script>
